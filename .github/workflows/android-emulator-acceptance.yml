name: Android Emulator Acceptance

on:
    pull_request:
        paths:
            - 'src/**'
            - 'example/**'
            - 'scripts/android-acceptance-*.mjs'
            - 'scripts/android-tap-accessibility-label.mjs'
            - 'scripts/bootstrap-example.mjs'
            - 'scripts/build-example-android.mjs'
            - 'scripts/start-android-emulator-ci.sh'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/android-emulator-acceptance.yml'
    workflow_dispatch:
        inputs:
            width:
                description: Acceptance width in dp
                required: false
                default: '320'
                type: choice
                options: ['320', '360', '390', '393', '430']
            font_scale:
                description: Android font scale
                required: false
                default: '1.3'
                type: choice
                options: ['1.0', '1.3']
            theme:
                description: Theme mode
                required: false
                default: dark
                type: choice
                options: [light, dark]
            run_matrix:
                description: Run the full four-profile visual matrix instead of one profile
                required: false
                default: false
                type: boolean
    schedule:
        - cron: '0 9 * * 1'

permissions:
    contents: read

jobs:
    acceptance:
        if: >-
            github.event_name != 'schedule' &&
            !(github.event_name == 'workflow_dispatch' && inputs.run_matrix) &&
            !(github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              startsWith(github.event.pull_request.title, '[visual-matrix]'))
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            ACCEPTANCE_WIDTH: ${{ inputs.width || '320' }}
            ACCEPTANCE_FONT_SCALE: ${{ inputs.font_scale || '1.3' }}
            ACCEPTANCE_THEME: ${{ inputs.theme || 'dark' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: gradle
                  cache-dependency-path: package-lock.json

            - name: Install Android SDK and emulator
              run: |
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                      "platform-tools" \
                      "emulator" \
                      "platforms;android-37.0" \
                      "build-tools;37.0.0" \
                      "ndk;27.1.12297006" \
                      "system-images;android-35;google_apis;x86_64"
                  ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
                  echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
                  mkdir -p "$RUNNER_TEMP/android-avd"
                  echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
                  if [ -e /dev/kvm ]; then
                      sudo chmod 666 /dev/kvm
                  fi

            - name: Install package dependencies
              run: npm ci

            - name: Bootstrap and build Preview
              run: |
                  npm run example:bootstrap
                  cd example/FresnicaPreview
                  npx tsc --noEmit
                  cd ../..
                  node scripts/build-example-android.mjs

            - name: Create and start emulator
              run: bash scripts/start-android-emulator-ci.sh

            - name: Apply acceptance profile
              run: npm run example:profile -- --width "$ACCEPTANCE_WIDTH" --font-scale "$ACCEPTANCE_FONT_SCALE" --theme "$ACCEPTANCE_THEME"

            - name: Start Metro
              working-directory: example/FresnicaPreview
              run: |
                  nohup npm start -- --port 8081 > "$RUNNER_TEMP/fresnica-metro.log" 2>&1 &
                  for attempt in $(seq 1 60); do
                      if curl -fsS http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
                          exit 0
                      fi
                      sleep 2
                  done
                  cat "$RUNNER_TEMP/fresnica-metro.log"
                  exit 1

            - name: Install and launch Preview
              run: |
                  adb reverse tcp:8081 tcp:8081
                  adb install -r example/FresnicaPreview/android/app/build/outputs/apk/debug/app-debug.apk
                  adb shell am force-stop com.fresnicapreview || true
                  adb shell monkey -p com.fresnicapreview -c android.intent.category.LAUNCHER 1

            - name: Select Simplified Chinese Stress scenario
              run: |
                  tap_label() {
                      for attempt in $(seq 1 45); do
                          if npm run example:tap-label -- "$1"; then
                              return 0
                          fi
                          sleep 2
                      done
                      return 1
                  }

                  tap_label "Language, 简体中文"
                  sleep 2
                  tap_label "内容场景, 压力测试"
                  sleep 2

            - name: Capture acceptance evidence
              id: capture
              run: |
                  npm run example:capture
                  EVIDENCE_DIR=$(find artifacts/android-acceptance -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
                  test -n "$EVIDENCE_DIR"
                  test -f "$EVIDENCE_DIR/device.json"
                  test -f "$EVIDENCE_DIR/screenshot.png"
                  test -f "$EVIDENCE_DIR/window.xml"
                  test -f "$EVIDENCE_DIR/manifest.json"
                  npm run example:verify -- "$EVIDENCE_DIR"
                  grep -Fq "Fresnica 原生预览" "$EVIDENCE_DIR/window.xml"
                  grep -Fq "压力测试" "$EVIDENCE_DIR/window.xml"
                  # Narrow Chinese theme labels should not wrap at 320dp.
                  if [ "$ACCEPTANCE_WIDTH" = 320 ]; then
                      grep -Fq "主题, 系统" "$EVIDENCE_DIR/window.xml"
                  fi
                  echo "dir=$EVIDENCE_DIR" >> "$GITHUB_OUTPUT"

            - name: Upload acceptance evidence
              uses: actions/upload-artifact@v7
              with:
                  name: android-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.ACCEPTANCE_WIDTH }}-${{ env.ACCEPTANCE_FONT_SCALE }}-${{ env.ACCEPTANCE_THEME }}
                  path: ${{ steps.capture.outputs.dir }}
                  if-no-files-found: error
                  retention-days: 90

            # Reuse the installed Preview and emulator: no second Android build is needed.
            # This covers English long copy and the offscreen component gallery without
            # changing the regular Chinese/Dark PR acceptance baseline.
            - name: Capture 393dp English Light Stress viewport
              if: github.event_name == 'pull_request'
              id: english_top
              run: |
                  npm run example:profile -- --width 393 --font-scale 1.3 --theme light
                  adb shell am force-stop com.fresnicapreview
                  adb shell monkey -p com.fresnicapreview -c android.intent.category.LAUNCHER 1

                  tap_label() {
                      for attempt in $(seq 1 45); do
                          if npm run example:tap-label -- "$1"; then
                              return 0
                          fi
                          sleep 2
                      done
                      return 1
                  }

                  tap_label "Content scenario, Stress"
                  sleep 2
                  npm run example:capture
                  EVIDENCE_DIR=$(find artifacts/android-acceptance -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
                  test -n "$EVIDENCE_DIR"
                  npm run example:verify -- "$EVIDENCE_DIR"
                  grep -Fq "Fresnica Native Preview" "$EVIDENCE_DIR/window.xml"
                  grep -Fq "Stress" "$EVIDENCE_DIR/window.xml"
                  echo "dir=$EVIDENCE_DIR" >> "$GITHUB_OUTPUT"

            - name: Upload 393dp English Light viewport
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: android-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-393-1.3-light-en-top
                  path: ${{ steps.english_top.outputs.dir }}
                  if-no-files-found: error
                  retention-days: 90

            - name: Capture English shared-component gallery
              if: github.event_name == 'pull_request'
              id: english_gallery
              run: |
                  # Scroll only within this non-sensitive Preview, stopping as soon as
                  # the previously offscreen gallery heading is visible.
                  for attempt in $(seq 1 8); do
                      adb shell uiautomator dump /sdcard/fresnica-gallery-window.xml >/dev/null
                      adb exec-out cat /sdcard/fresnica-gallery-window.xml > "$RUNNER_TEMP/fresnica-gallery-window.xml"
                      if grep -Fq "More shared primitives" "$RUNNER_TEMP/fresnica-gallery-window.xml"; then
                          break
                      fi
                      adb shell input swipe 460 1120 460 360 500
                      sleep 2
                  done
                  grep -Fq "More shared primitives" "$RUNNER_TEMP/fresnica-gallery-window.xml"
                  adb shell rm -f /sdcard/fresnica-gallery-window.xml

                  npm run example:capture
                  EVIDENCE_DIR=$(find artifacts/android-acceptance -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
                  test -n "$EVIDENCE_DIR"
                  npm run example:verify -- "$EVIDENCE_DIR"
                  grep -Fq "More shared primitives" "$EVIDENCE_DIR/window.xml"
                  echo "dir=$EVIDENCE_DIR" >> "$GITHUB_OUTPUT"

            - name: Upload English shared-component gallery
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: android-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-393-1.3-light-en-gallery
                  path: ${{ steps.english_gallery.outputs.dir }}
                  if-no-files-found: error
                  retention-days: 90

            # UI-only interaction evidence. Reuse the installed English/Light
            # Preview from above; no additional Gradle build is required.
            - name: Exercise modal Android Back and capture before/after
              if: github.event_name == 'pull_request'
              id: modal_interaction
              run: |
                  opened=0
                  for attempt in $(seq 1 10); do
                      if npm run example:tap-label -- "Open modal"; then
                          sleep 2
                          adb shell uiautomator dump /sdcard/fresnica-modal-window.xml >/dev/null
                          adb exec-out cat /sdcard/fresnica-modal-window.xml > "$RUNNER_TEMP/fresnica-modal-open.xml"
                          if grep -Fq "Preview modal" "$RUNNER_TEMP/fresnica-modal-open.xml"; then
                              opened=1
                              break
                          fi
                      fi
                      # A partially visible button may report a successful tap while
                      # its center is behind the navigation bar. Retry only after
                      # checking that the modal actually appeared.
                      adb shell input swipe 460 1120 460 360 500
                      sleep 2
                  done
                  test "$opened" = 1
                  sleep 2

                  adb shell uiautomator dump /sdcard/fresnica-modal-window.xml >/dev/null
                  adb exec-out cat /sdcard/fresnica-modal-window.xml > "$RUNNER_TEMP/fresnica-modal-open.xml"
                  grep -Fq "Preview modal" "$RUNNER_TEMP/fresnica-modal-open.xml"
                  npm run example:capture
                  OPEN_DIR=$(find artifacts/android-acceptance -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
                  npm run example:verify -- "$OPEN_DIR"
                  grep -Fq "Preview modal" "$OPEN_DIR/window.xml"
                  echo "open=$OPEN_DIR" >> "$GITHUB_OUTPUT"

                  adb shell input keyevent KEYCODE_BACK
                  sleep 3
                  adb shell uiautomator dump /sdcard/fresnica-modal-window.xml >/dev/null
                  adb exec-out cat /sdcard/fresnica-modal-window.xml > "$RUNNER_TEMP/fresnica-modal-closed.xml"
                  if grep -Fq "Preview modal" "$RUNNER_TEMP/fresnica-modal-closed.xml"; then
                      echo "Modal remained visible after Android Back" >&2
                      exit 1
                  fi
                  grep -Fq "Open modal" "$RUNNER_TEMP/fresnica-modal-closed.xml"
                  npm run example:capture
                  CLOSED_DIR=$(find artifacts/android-acceptance -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
                  npm run example:verify -- "$CLOSED_DIR"
                  if grep -Fq "Preview modal" "$CLOSED_DIR/window.xml"; then
                      echo "Modal still visible in dismissal evidence" >&2
                      exit 1
                  fi
                  echo "closed=$CLOSED_DIR" >> "$GITHUB_OUTPUT"
                  adb shell rm -f /sdcard/fresnica-modal-window.xml

            - name: Upload modal Android Back interaction evidence
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: android-interaction-${{ github.run_id }}-${{ github.run_attempt }}-modal-open
                  path: ${{ steps.modal_interaction.outputs.open }}
                  if-no-files-found: error
                  retention-days: 90

            - name: Upload modal-dismissed evidence
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: android-interaction-${{ github.run_id }}-${{ github.run_attempt }}-modal-back-dismissed
                  path: ${{ steps.modal_interaction.outputs.closed }}
                  if-no-files-found: error
                  retention-days: 90

            - name: Exercise keyboard visibility and reachable action
              if: github.event_name == 'pull_request'
              id: keyboard_interaction
              run: |
                  focused=0
                  for attempt in $(seq 1 10); do
                      if npm run example:tap-label -- "Keyboard visibility check"; then
                          focused=1
                          break
                      fi
                      adb shell input swipe 460 1120 460 360 500
                      sleep 2
                  done
                  test "$focused" = 1
                  sleep 2
                  typed=0
                  for attempt in $(seq 1 12); do
                      if [ "$(adb get-state 2>/dev/null)" = device ] && adb shell input text fresnica; then
                          typed=1
                          break
                      fi
                      echo "Waiting for ADB to recover before typing (attempt $attempt)" >&2
                      sleep 3
                  done
                  test "$typed" = 1
                  sleep 2

                  check_ime_visible() {
                      adb shell dumpsys input_method > "$RUNNER_TEMP/fresnica-ime-status.txt"
                      grep -Eq 'mInputShown=true|mInputViewStarted=true|isInputViewShown=true' "$RUNNER_TEMP/fresnica-ime-status.txt"
                  }
                  if ! check_ime_visible; then
                      echo "Android IME not visible after focusing the keyboard field" >&2
                      tail -n 90 "$RUNNER_TEMP/fresnica-ime-status.txt" >&2
                      exit 1
                  fi

                  reached=0
                  for attempt in $(seq 1 8); do
                      adb shell uiautomator dump /sdcard/fresnica-keyboard-window.xml >/dev/null
                      adb exec-out cat /sdcard/fresnica-keyboard-window.xml > "$RUNNER_TEMP/fresnica-keyboard-window.xml"
                      if grep -Fq "Primary action below keyboard field" "$RUNNER_TEMP/fresnica-keyboard-window.xml"; then
                          # UIAutomator can report nodes covered by the IME. Only an
                          # actual button tap followed by App feedback proves reachability.
                          npm run example:capture
                          BEFORE_DIR=$(find artifacts/android-acceptance -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
                          npm run example:verify -- "$BEFORE_DIR"
                          if npm run example:tap-label -- "Primary action below keyboard field"; then
                              sleep 2
                              adb shell uiautomator dump /sdcard/fresnica-keyboard-window.xml >/dev/null
                              adb exec-out cat /sdcard/fresnica-keyboard-window.xml > "$RUNNER_TEMP/fresnica-keyboard-window.xml"
                              if grep -Fq "Keyboard action was pressed" "$RUNNER_TEMP/fresnica-keyboard-window.xml"; then
                                  reached=1
                                  echo "before=$BEFORE_DIR" >> "$GITHUB_OUTPUT"
                                  break
                              fi
                          fi
                      fi
                      # Keep both gesture endpoints above the IME's top edge.
                      adb shell input swipe 460 760 460 280 450
                      sleep 2
                  done
                  if [ "$reached" != 1 ]; then
                      echo "Keyboard action was present in UI tree but could not be tapped" >&2
                      exit 1
                  fi
                  if ! check_ime_visible; then
                      echo "Android IME disappeared before post-tap capture" >&2
                      tail -n 90 "$RUNNER_TEMP/fresnica-ime-status.txt" >&2
                      exit 1
                  fi

                  npm run example:capture
                  EVIDENCE_DIR=$(find artifacts/android-acceptance -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
                  npm run example:verify -- "$EVIDENCE_DIR"
                  grep -Fq "Keyboard action was pressed" "$EVIDENCE_DIR/window.xml"
                  echo "dir=$EVIDENCE_DIR" >> "$GITHUB_OUTPUT"
                  adb shell rm -f /sdcard/fresnica-keyboard-window.xml

            - name: Upload keyboard before-tap interaction evidence
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: android-interaction-${{ github.run_id }}-${{ github.run_attempt }}-keyboard-before-tap
                  path: ${{ steps.keyboard_interaction.outputs.before }}
                  if-no-files-found: error
                  retention-days: 90

            - name: Upload keyboard interaction evidence
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v7
              with:
                  name: android-interaction-${{ github.run_id }}-${{ github.run_attempt }}-keyboard-reachable
                  path: ${{ steps.keyboard_interaction.outputs.dir }}
                  if-no-files-found: error
                  retention-days: 90

            - name: Capture UI diagnostics on failure
              if: failure()
              run: |
                  DIAG_DIR="$RUNNER_TEMP/android-failure"
                  mkdir -p "$DIAG_DIR"
                  adb exec-out screencap -p > "$DIAG_DIR/screenshot.png" || true
                  adb shell uiautomator dump /sdcard/fresnica-failure-window.xml || true
                  adb pull /sdcard/fresnica-failure-window.xml "$DIAG_DIR/window.xml" || true
                  adb shell rm -f /sdcard/fresnica-failure-window.xml || true

            - name: Upload UI diagnostics on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: android-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.ACCEPTANCE_WIDTH }}-${{ env.ACCEPTANCE_FONT_SCALE }}-${{ env.ACCEPTANCE_THEME }}
                  path: ${{ runner.temp }}/android-failure
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Print diagnostics on failure
              if: failure()
              run: |
                  tail -n 200 "$RUNNER_TEMP/fresnica-emulator.log" || true
                  tail -n 200 "$RUNNER_TEMP/fresnica-metro.log" || true
                  adb devices -l || true
                  ps -ef | grep '[e]mulator' || true
                  "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd || true
                  timeout 20 adb logcat -d -t 200 || true

    weekly-matrix:
        # Explicit opt-in for a trusted PR, manual full-matrix dispatch, or Monday schedule.
        if: >-
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.run_matrix) ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             startsWith(github.event.pull_request.title, '[visual-matrix]'))
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - width: '320'
                      font_scale: '1.0'
                      theme: light
                    - width: '360'
                      font_scale: '1.0'
                      theme: dark
                    - width: '390'
                      font_scale: '1.3'
                      theme: light
                    - width: '430'
                      font_scale: '1.3'
                      theme: dark
        env:
            ACCEPTANCE_WIDTH: ${{ matrix.width }}
            ACCEPTANCE_FONT_SCALE: ${{ matrix.font_scale }}
            ACCEPTANCE_THEME: ${{ matrix.theme }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: gradle
                  cache-dependency-path: package-lock.json

            - name: Install Android SDK and emulator
              run: |
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                      "platform-tools" \
                      "emulator" \
                      "platforms;android-37.0" \
                      "build-tools;37.0.0" \
                      "ndk;27.1.12297006" \
                      "system-images;android-35;google_apis;x86_64"
                  ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
                  echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
                  mkdir -p "$RUNNER_TEMP/android-avd"
                  echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
                  if [ -e /dev/kvm ]; then
                      sudo chmod 666 /dev/kvm
                  fi

            - name: Install package dependencies
              run: npm ci

            - name: Bootstrap and build Preview
              run: |
                  npm run example:bootstrap
                  cd example/FresnicaPreview
                  npx tsc --noEmit
                  cd ../..
                  node scripts/build-example-android.mjs

            - name: Create and start emulator
              run: bash scripts/start-android-emulator-ci.sh

            - name: Apply acceptance profile
              run: npm run example:profile -- --width "$ACCEPTANCE_WIDTH" --font-scale "$ACCEPTANCE_FONT_SCALE" --theme "$ACCEPTANCE_THEME"

            - name: Start Metro
              working-directory: example/FresnicaPreview
              run: |
                  nohup npm start -- --port 8081 > "$RUNNER_TEMP/fresnica-metro.log" 2>&1 &
                  for attempt in $(seq 1 60); do
                      if curl -fsS http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
                          exit 0
                      fi
                      sleep 2
                  done
                  cat "$RUNNER_TEMP/fresnica-metro.log"
                  exit 1

            - name: Install and launch Preview
              run: |
                  adb reverse tcp:8081 tcp:8081
                  adb install -r example/FresnicaPreview/android/app/build/outputs/apk/debug/app-debug.apk
                  adb shell am force-stop com.fresnicapreview || true
                  adb shell monkey -p com.fresnicapreview -c android.intent.category.LAUNCHER 1

            - name: Select Simplified Chinese Stress scenario
              run: |
                  tap_label() {
                      for attempt in $(seq 1 45); do
                          if npm run example:tap-label -- "$1"; then
                              return 0
                          fi
                          sleep 2
                      done
                      return 1
                  }

                  tap_label "Language, 简体中文"
                  sleep 2
                  tap_label "内容场景, 压力测试"
                  sleep 2

            - name: Capture acceptance evidence
              id: capture
              run: |
                  npm run example:capture
                  EVIDENCE_DIR=$(find artifacts/android-acceptance -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
                  test -n "$EVIDENCE_DIR"
                  test -f "$EVIDENCE_DIR/device.json"
                  test -f "$EVIDENCE_DIR/screenshot.png"
                  test -f "$EVIDENCE_DIR/window.xml"
                  test -f "$EVIDENCE_DIR/manifest.json"
                  npm run example:verify -- "$EVIDENCE_DIR"
                  grep -Fq "Fresnica 原生预览" "$EVIDENCE_DIR/window.xml"
                  grep -Fq "压力测试" "$EVIDENCE_DIR/window.xml"
                  # Narrow Chinese theme labels should not wrap at 320dp.
                  if [ "$ACCEPTANCE_WIDTH" = 320 ]; then
                      grep -Fq "主题, 系统" "$EVIDENCE_DIR/window.xml"
                  fi
                  echo "dir=$EVIDENCE_DIR" >> "$GITHUB_OUTPUT"

            - name: Upload acceptance evidence
              uses: actions/upload-artifact@v7
              with:
                  name: android-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.ACCEPTANCE_WIDTH }}-${{ env.ACCEPTANCE_FONT_SCALE }}-${{ env.ACCEPTANCE_THEME }}
                  path: ${{ steps.capture.outputs.dir }}
                  if-no-files-found: error
                  retention-days: 90

            - name: Capture UI diagnostics on failure
              if: failure()
              run: |
                  DIAG_DIR="$RUNNER_TEMP/android-failure"
                  mkdir -p "$DIAG_DIR"
                  adb exec-out screencap -p > "$DIAG_DIR/screenshot.png" || true
                  adb shell uiautomator dump /sdcard/fresnica-failure-window.xml || true
                  adb pull /sdcard/fresnica-failure-window.xml "$DIAG_DIR/window.xml" || true
                  adb shell rm -f /sdcard/fresnica-failure-window.xml || true

            - name: Upload UI diagnostics on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: android-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.ACCEPTANCE_WIDTH }}-${{ env.ACCEPTANCE_FONT_SCALE }}-${{ env.ACCEPTANCE_THEME }}
                  path: ${{ runner.temp }}/android-failure
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Print diagnostics on failure
              if: failure()
              run: |
                  tail -n 200 "$RUNNER_TEMP/fresnica-emulator.log" || true
                  tail -n 200 "$RUNNER_TEMP/fresnica-metro.log" || true
                  adb devices -l || true
                  ps -ef | grep '[e]mulator' || true
                  "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd || true
                  timeout 20 adb logcat -d -t 200 || true
