name: Archive Q03 Q05 iOS Evidence

on:
    pull_request:
        paths:
            - '.github/workflows/archive-q03-q05-evidence.yml'

permissions:
    actions: read
    contents: write

jobs:
    archive:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Checkout evidence branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0

            - name: Download and verify historical artifacts
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  work="${RUNNER_TEMP}/fresnica-ios-evidence"
                  rm -rf "$work"
                  mkdir -p "$work"

                  download_artifact() {
                      id="$1"
                      digest="$2"
                      destination="$3"
                      zip="$work/artifact-${id}.zip"
                      mkdir -p "$destination"
                      curl --fail --location --silent --show-error \
                          -H "Authorization: Bearer ${GH_TOKEN}" \
                          -H "Accept: application/vnd.github+json" \
                          -H "X-GitHub-Api-Version: 2022-11-28" \
                          -o "$zip" \
                          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip"
                      echo "${digest}  ${zip}" | sha256sum -c -
                      unzip -q "$zip" -d "$destination"
                  }

                  download_artifact 12168868814 2f2fcd6c17f2828ede41fa8845e90f33f701cb3e4ae6f84a004a1c99bce250a5 "$work/q03-s03-actions"
                  download_artifact 12169214601 fd1e9c76bd3a2f4886b44233c36f4ad90de509aa4f9b0d6360e57ded03432dc4 "$work/q03-s04-actions"
                  download_artifact 12169662134 b17057ffb3cfaea31e1be4c5b4e0c244c5c5d7da6aebdc7a1af839b531b2ab5f "$work/q03-s04-content"
                  download_artifact 12180134517 438dbeeb0093ccfb3942269ed30200b097cd754b1d04b4b1ea14f7fc1c86932d "$work/q05"

                  q03="docs/visual-baselines/ios/2026-10-19"
                  cp "$work/q03-s03-actions/launch.png" "$q03/s03-actions-q03.png"
                  cp "$work/q03-s03-actions/metadata.json" "$q03/s03-actions-q03.metadata.json"
                  cp "$work/q03-s04-actions/launch.png" "$q03/s04-actions-q03.png"
                  cp "$work/q03-s04-actions/metadata.json" "$q03/s04-actions-q03.metadata.json"
                  cp "$work/q03-s04-content/launch.png" "$q03/s04-content-q03.png"
                  cp "$work/q03-s04-content/metadata.json" "$q03/s04-content-q03.metadata.json"

                  q05="docs/visual-baselines/ios/2026-10-20/q05-interactions"
                  mkdir -p "$q05/attachments"
                  cp "$work/q05/metadata.json" "$q05/metadata.json"
                  cp "$work/q05/attachments/manifest.json" "$q05/attachments/manifest.json"
                  cp "$work/q05/attachments/"*.png "$q05/attachments/"

                  cat <<'EOF' | sha256sum -c -
                  ed6080b53931c1ab65bbb385b14c4d06c4a24656627318ef6ac8f8c1cf2530d6  docs/visual-baselines/ios/2026-10-19/s03-actions-q03.png
                  08b65ea3ff9610231a34ddc0214b4c61f996699a915392ac284dda5d8d613620  docs/visual-baselines/ios/2026-10-19/s03-actions-q03.metadata.json
                  7e1e321f8666cf01dd3f6641341a2c08866ed5b08f1fdd4e21ab5d88ffca8c64  docs/visual-baselines/ios/2026-10-19/s04-actions-q03.png
                  dee6e9c7394302b6f17ef5ecdbdc57cd8aac004f81b96377c443ac327b1069f1  docs/visual-baselines/ios/2026-10-19/s04-actions-q03.metadata.json
                  e90b8147fc1170a245ca1fb26ac445261033302a64a92c5554d32a82e86f3450  docs/visual-baselines/ios/2026-10-19/s04-content-q03.png
                  764f03263a7d79cdee913c1d790e5953b01ebed7f884c604fa421feb75ba89fe  docs/visual-baselines/ios/2026-10-19/s04-content-q03.metadata.json
                  38cd9e6c935e2a1e1cc2c7c8cc01789a17b83785638d1b720af449afc883376d  docs/visual-baselines/ios/2026-10-20/q05-interactions/metadata.json
                  726586d2a7ea1c0235065a1520ca8939702d4f07e39de07fecfe6c9abd2b62c6  docs/visual-baselines/ios/2026-10-20/q05-interactions/attachments/manifest.json
                  1970c320f585640eb81184d9c056442dc36b44c05bdda8616c85472b050aa35f  docs/visual-baselines/ios/2026-10-20/q05-interactions/attachments/161067C2-B26E-4B27-8C72-5D905499BB4C.png
                  8d4483427828dd489a4d81011ce3135323cbbd8951fbc72af52b28b1e4196863  docs/visual-baselines/ios/2026-10-20/q05-interactions/attachments/453D32AD-7E73-466A-BC56-9873BF1E3A16.png
                  985b82ea71104c9543b9713b90c9d8dfd6aafd91eade0201cdac4138b1713ce8  docs/visual-baselines/ios/2026-10-20/q05-interactions/attachments/798A0B7D-5658-4971-83B8-168FA84CFAFD.png
                  969f4ebca594b646cc92f5ea79c5bd16f14ca22fb985638ebf1fd41b137aa98c  docs/visual-baselines/ios/2026-10-20/q05-interactions/attachments/8089F370-8681-4657-8F77-D7FE0B100562.png
                  6dc40d71b5868422b98f18368de4ba9d2de38b2211a87815936bb6af02ff03ff  docs/visual-baselines/ios/2026-10-20/q05-interactions/attachments/CFA4D7F3-8926-478E-9C40-691F8F5D2F7D.png
                  531ddcb1c5620418ae5d81f26cab87b19d4a6db648a918c256aca565e47733b7  docs/visual-baselines/ios/2026-10-20/q05-interactions/attachments/F2D7ECA5-9D98-401B-A821-58EDA6552E13.png
                  3e6d1c3113a8a9394f53ec359e6e118359a0849d89e8bd784f207e0f9026196b  docs/visual-baselines/ios/2026-10-20/q05-interactions/attachments/FDC58839-DA83-485C-A093-DE930549C4F2.png
                  EOF

            - name: Commit exact evidence bytes
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add docs/visual-baselines/ios/2026-10-19 docs/visual-baselines/ios/2026-10-20/q05-interactions
                  git commit -m "docs: archive Q03 and Q05 iOS evidence bytes"
                  git push origin "HEAD:${GITHUB_HEAD_REF}"
