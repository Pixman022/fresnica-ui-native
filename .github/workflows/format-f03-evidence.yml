name: Format F03 Evidence Verifier

on:
    pull_request:
        paths:
            - '.github/workflows/format-f03-evidence.yml'

permissions:
    contents: write

jobs:
    format:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Checkout evidence branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Format evidence verifier
              run: npx prettier --write scripts/verify-ios-evidence.mjs
            - name: Commit formatted verifier
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add scripts/verify-ios-evidence.mjs
                  git diff --cached --quiet && exit 0
                  git commit -m "style: format iOS evidence verifier"
                  git push origin "HEAD:${GITHUB_HEAD_REF}"
