name: Format Diagnostic

on:
    pull_request:
        paths:
            - 'example/App.tsx'
            - '.github/workflows/format-debug.yml'

permissions:
    contents: read

jobs:
    diff:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Print Prettier diff
              run: |
                  npx prettier example/App.tsx > "$RUNNER_TEMP/App.formatted.tsx"
                  diff -u example/App.tsx "$RUNNER_TEMP/App.formatted.tsx" || true
