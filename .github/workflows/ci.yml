name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout native package
              uses: actions/checkout@v7
              with:
                  path: fresnica-ui-native

            - name: Checkout Web token source
              uses: actions/checkout@v7
              with:
                  repository: Pixman022/fresnica-ui
                  path: fresnica-ui

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm
                  cache-dependency-path: fresnica-ui-native/package-lock.json

            - name: Install dependencies
              working-directory: fresnica-ui-native
              run: npm ci

            - name: Print NU01 formatted contract
              working-directory: fresnica-ui-native
              run: npx prettier docs/public-api-contract.md

            - name: Audit native dependencies (report only)
              working-directory: fresnica-ui-native
              continue-on-error: true
              run: npm audit --audit-level=moderate

            - name: Audit native production dependencies (report only)
              working-directory: fresnica-ui-native
              continue-on-error: true
              run: npm audit --omit=dev --audit-level=moderate

            - name: Run standalone tests
              working-directory: fresnica-ui-native
              run: npm test

            - name: Verify shared token source
              working-directory: fresnica-ui-native
              run: npm run test:source-contract

            - name: Build package
              working-directory: fresnica-ui-native
              run: npm run build
