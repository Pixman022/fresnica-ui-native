name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            create_delivery_candidate:
                description: Create and upload a new delivery candidate after an explicit version decision
                required: false
                default: false
                type: boolean

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout native package
              uses: actions/checkout@v7
              with:
                  path: fresnica-ui-native

            - name: Checkout Web token source
              uses: actions/checkout@v7
              with:
                  repository: Pixman022/fresnica-ui
                  ref: 15d49e0be28a232ae6de2a7285a3a77add8c87d4
                  path: fresnica-ui

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm
                  cache-dependency-path: fresnica-ui-native/package-lock.json

            - name: Install dependencies
              working-directory: fresnica-ui-native
              run: npm ci

            - name: Audit native development dependencies (report only)
              working-directory: fresnica-ui-native
              continue-on-error: true
              run: npm audit --audit-level=moderate

            - name: Audit native production dependencies (gate)
              working-directory: fresnica-ui-native
              run: npm audit --omit=dev --audit-level=moderate

            - name: Run standalone tests
              working-directory: fresnica-ui-native
              run: npm test

            - name: Enforce package coverage gate
              working-directory: fresnica-ui-native
              run: npm run test:coverage

            - name: Upload package coverage report
              uses: actions/upload-artifact@v7
              with:
                  name: native-package-coverage
                  path: fresnica-ui-native/coverage
                  if-no-files-found: error
                  retention-days: 30

            - name: Verify archived iOS visual evidence
              working-directory: fresnica-ui-native
              run: node scripts/verify-ios-evidence.mjs

            - name: Verify shared token source
              working-directory: fresnica-ui-native
              run: npm run test:source-contract

            - name: Build package
              working-directory: fresnica-ui-native
              run: npm run build

            - name: Verify packed package contract
              working-directory: fresnica-ui-native
              run: npm run test:package

            - name: Validate delivery candidate request
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_delivery_candidate }}
              working-directory: fresnica-ui-native
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [ "$version" = "1.1.0-rc.1" ]; then
                      echo "::error::1.1.0-rc.1 is frozen; bump the package version after an explicit candidate decision before generating another delivery artifact."
                      exit 1
                  fi

            - name: Create explicitly requested internal delivery candidate
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_delivery_candidate }}
              working-directory: fresnica-ui-native
              env:
                  DELIVERY_SOURCE_SHA: ${{ github.sha }}
              run: npm run delivery:artifact

            - name: Upload explicitly requested internal delivery candidate
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_delivery_candidate }}
              uses: actions/upload-artifact@v7
              with:
                  name: fresnica-ui-native-delivery-${{ github.sha }}
                  path: fresnica-ui-native/artifacts/delivery
                  if-no-files-found: error
                  retention-days: 90
