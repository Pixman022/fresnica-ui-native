name: Format Helper

on:
    push:
        branches:
            - feat/noncustodial-wallet-foundation

permissions:
    contents: read

jobs:
    diff:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm
            - run: npm ci
            - name: Show Prettier diff
              run: |
                  npx prettier --write product/App.tsx THIRD_PARTY_NOTICES.md
                  git diff -- product/App.tsx THIRD_PARTY_NOTICES.md
                  git diff --exit-code -- product/App.tsx THIRD_PARTY_NOTICES.md
