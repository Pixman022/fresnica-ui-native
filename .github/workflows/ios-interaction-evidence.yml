name: iOS Interaction Evidence

on:
    pull_request:
        paths:
            - 'example/App.tsx'
            - 'scripts/run-example-ios-interactions.mjs'
            - 'package.json'
            - '.github/workflows/ios-interaction-evidence.yml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    keyboard-action:
        runs-on: macos-15
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Select Xcode 16.4
              run: sudo xcode-select -s /Applications/Xcode_16.4.app

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Install package dependencies
              run: npm ci

            - name: Build package
              run: npm run build

            - name: Bootstrap Preview host from packed package
              run: npm run example:bootstrap

            - name: Exercise keyboard and primary action
              env:
                  IOS_PREVIEW_DEVICE: iPhone 16
                  IOS_PREVIEW_RUNTIME: '18.5'
              run: npm run example:ios:interactions

            - name: Upload iOS interaction evidence
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: ios-interaction-keyboard-action
                  path: example/ios-interaction-evidence
                  if-no-files-found: warn
                  retention-days: 90
